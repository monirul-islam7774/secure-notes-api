name: Keep alive

# Render's free tier sleeps after ~15 min idle. Ping the health endpoint every 10 min so reviewers
# do not hit a 30-50 s cold start. Does nothing until the API_URL repository variable is set.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.API_URL }}
    steps:
      - name: Ping /api/health
        run: |
          if [ -z "$API_URL" ]; then echo "API_URL not set - nothing to ping."; exit 0; fi
          curl -fsS --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 "$API_URL/api/health"
